<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>中古本ランキング — 中古ハンター</title>
<meta name="description" content="販売中の中古本を全サイト横断で集め、定価比の割引率でランキングする。" />
<link rel="stylesheet" href="/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>📚</text></svg>" />
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1>📚 中古本ランキング</h1>
    <p class="tagline">販売中の中古本を全サイト横断で集め、<strong>新品価格比の割引率</strong>と<strong>相場からの乖離</strong>でランキングする。</p>
    <p class="tagline"><a href="/">← 商品検索（本以外はこちら）</a></p>
  </div>
</header>

<main class="wrap">
  <form id="book-form" class="panel search">
    <div class="row main-row">
      <textarea id="titles" rows="3" placeholder="書名またはISBNを1行に1冊。複数行でまとめてランキングできる。&#10;例:&#10;金持ち父さん貧乏父さん&#10;LIFE SHIFT&#10;9784478004555"></textarea>
      <button id="submit" type="submit">ランキング作成</button>
    </div>
    <div class="row filters">
      <label>ランキング基準
        <select id="mode">
          <option value="discount">新品価格比の割引率が大きい順</option>
          <option value="gap">相場からの乖離が大きい順（掘り出し物）</option>
          <option value="cheapest">最安値が安い順</option>
          <option value="supply">出品数が多い順（値崩れしやすい）</option>
        </select>
      </label>
      <label>1冊あたり取得数
        <select id="limit">
          <option value="10">10</option>
          <option value="20" selected>20</option>
          <option value="40">40</option>
        </select>
      </label>
    </div>
    <p class="muted" style="font-size:12px;margin:8px 0 0">
      本1冊ごとに複数サイトへ問い合わせます。10冊まとめて投げると数十秒かかることがあります。
    </p>
  </form>

  <div id="notice" class="panel setup" hidden></div>
  <section id="ranking" class="results"></section>
  <div id="empty" class="panel empty" hidden></div>
</main>

<footer class="wrap footer">
  <p class="muted">
    「新品価格」は書誌API（楽天ブックス / openBD）由来で、<strong>定価とは限りません</strong>（新品が値引き中ならその価格になり、割引率は控えめに出ます）。取得できない本は「—」と表示し、推定値で埋めません。
    送料不明の出品は本体価格のみで比較しているため、実際の総額では順位が入れ替わることがあります。
  </p>
</footer>

<script src="/books.js"></script>
</body>
</html>
